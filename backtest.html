<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BTC 규칙 백테스트</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0d1117;--surface:#161b22;--surface2:#1c2128;--line:#30363d;
 --text:#c9d1d9;--muted:#8b949e;--faint:#6e7681;
 --up:#3fb950;--down:#f85149;--amber:#ffb224;--blue:#58a6ff;--teal:#2dd4bf}
body{background:var(--bg);color:var(--text);padding:14px;max-width:1300px;margin:0 auto;
 font:13px/1.55 -apple-system,"Hiragino Kaku Gothic ProN","Noto Sans KR",sans-serif}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
h1{font-size:16px;font-weight:700}
.meta{color:var(--faint);font-size:11px;margin-left:auto}
a.nav,button{background:var(--surface2);border:1px solid var(--line);color:var(--muted);
 padding:5px 11px;border-radius:6px;cursor:pointer;font-size:11.5px;text-decoration:none}
a.nav:hover,button:hover{border-color:var(--amber);color:var(--amber)}
button.on{background:var(--amber);color:#2a1f05;border-color:var(--amber)}
.note{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--amber);
 border-radius:8px;padding:12px 14px;margin-bottom:12px;font-size:12.5px;line-height:1.7}
.note b{color:var(--amber)}
.note .k{color:var(--down);font-weight:700}
.tabs{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap}
.wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);
 border-radius:10px;padding:12px;margin-bottom:12px}
h2{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;
 margin-bottom:4px;font-weight:600}
.sub{color:var(--faint);font-size:11px;margin-bottom:9px}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:900px}
th{text-align:right;color:var(--faint);font-weight:600;font-size:10.5px;padding:5px 7px;
 border-bottom:1px solid var(--line);text-transform:uppercase;white-space:nowrap}
th:first-child{text-align:left}
td{padding:6px 7px;border-bottom:1px solid #21262d;text-align:right;font-variant-numeric:tabular-nums}
td:first-child{text-align:left;color:var(--text)}
tr:last-child td{border-bottom:0}
tr.strong td{background:rgba(63,185,80,.07)}
.u{color:var(--up)}.d{color:var(--down)}.n{color:var(--muted)}
.vb{padding:1px 7px;border-radius:999px;font-size:10px;font-weight:800}
.vb.강{background:rgba(63,185,80,.18);color:var(--up)}
.vb.약{background:rgba(255,178,36,.18);color:var(--amber)}
.vb.무{background:var(--surface2);color:var(--faint)}
.vb.과최적화{background:rgba(248,81,73,.18);color:var(--down)}
.split{font-size:10.5px;color:var(--faint)}
.split b{font-variant-numeric:tabular-nums}
.ctrl{background:var(--surface2);border:1px solid var(--line);border-radius:7px;
 padding:8px 11px;margin-bottom:9px;font-size:11.5px;color:var(--muted)}
.side{font-size:10px;padding:1px 5px;border-radius:4px;margin-right:5px}
.side.l{background:rgba(63,185,80,.15);color:var(--up)}
.side.s{background:rgba(248,81,73,.15);color:var(--down)}
.side.b{background:var(--surface2);color:var(--faint)}
footer{color:var(--faint);font-size:10.5px;margin-top:16px;text-align:center;line-height:1.7}
</style>
</head>
<body>

<header>
  <h1>📊 규칙 백테스트</h1>
  <a class="nav" href="mtf.html">멀티 TF</a>
  <a class="nav" href="index.html">메인</a>
  <span class="meta" id="meta">불러오는 중…</span>
</header>

<div class="note" id="note"></div>

<div class="tabs" id="tabs"></div>
<div id="panes"></div>

<footer>
  진입은 신호 봉의 <b>다음 봉 시가</b>, 청산은 ATR 손절 1.5배 / 익절 3배, 미도달 시 보유기간 만료 종가.<br>
  모든 지표는 해당 시점까지의 데이터만 사용하여 미래참조가 없습니다.<br>
  과거 성과가 미래를 보장하지 않습니다. 정보 제공 목적이며 투자 자문이 아닙니다.
</footer>

<script>
var D=null, CUR=null, FWD=null;

function f(v,d){ return v==null||!isFinite(v)?'—':v.toFixed(d==null?2:d); }
function sg(v,d){ if(v==null||!isFinite(v))return '—'; return (v>0?'+':'')+v.toFixed(d==null?2:d); }
function cls(v){ return v==null?'n':(v>0?'u':(v<0?'d':'n')); }

fetch('backtest.json',{cache:'no-store'})
 .then(function(r){return r.json()})
 .then(function(j){ D=j; init(); })
 .catch(function(e){ document.getElementById('meta').textContent='로드 실패: '+e.message; });

function init(){
  document.getElementById('meta').textContent=D.generated_at_jst;
  // 요약 판정
  var tot=0, strong=[], tfpos={};
  Object.keys(D.results).forEach(function(tf){
    var rows=D.results[tf];
    tfpos[tf]=rows.filter(function(r){return r.net>0}).length;
    tot+=rows.length;
    rows.forEach(function(r){ if(r.verdict==='강') strong.push(r); });
  });
  var n=document.getElementById('note');
  var bt=D.results[Object.keys(D.results)[0]][0];
  var BT_T=bt?bt.bonf_t:4.58;
  var html='<b>읽는 법</b> — 순기대값은 왕복 수수료 '+D.params.fee_roundtrip+
    '% + 펀딩 '+D.params.funding_per_8h+'%/8h를 뺀 값입니다.<br>'+
    '규칙 '+D.params.n_tests+'개를 동시에 시험했으므로 <b>다중검정 보정</b>이 필요합니다. '+
    '무작위 데이터에서도 이만큼 시험하면 t=2를 넘는 규칙이 몇 개 우연히 나오기 때문입니다. '+
    '보정 후 기준은 <b>t ≥ '+f(BT_T)+'</b>입니다.<br>'+
    '<b>학습70%/검증30%</b>는 앞 기간으로 고른 규칙이 뒤 기간에서도 통했는지 봅니다. '+
    '학습에서만 좋고 검증에서 무너지면 <span class="k">과최적화</span>입니다.<br><br>';
  html+='<b>결과 요약</b><br>';
  Object.keys(D.meta).forEach(function(tf){
    var m=D.meta[tf], p=tfpos[tf], t=D.results[tf].length;
    html+='· '+m.ko+' ('+m.from+'~'+m.to+') — 비용 차감 후 플러스 '+
      '<span class="'+(p>0?'u':'d')+'">'+p+'/'+t+'</span>개<br>';
  });
  html+='<br>';
  var weak=[],over=[];
  Object.keys(D.results).forEach(function(tf){
    D.results[tf].forEach(function(r){
      if(r.verdict==='약') weak.push(r);
      if(r.verdict==='과최적화') over.push(r);
    });
  });
  if(strong.length){
    html+='<b>보정 기준을 통과한 규칙</b> — '+strong.length+'개<br>';
    strong.forEach(function(r){
      html+='· '+r.tf_ko+' <b>'+r.ko+'</b> — 표본 '+r.n+', 순기대 '+sg(r.net)+'%, t='+f(r.tstat_net)+'<br>';
    });
  } else {
    html+='<span class="k">보정 기준(t ≥ '+f(BT_T)+')을 통과한 규칙은 없습니다.</span><br>';
  }
  if(weak.length){
    html+='<br><b>조건부 후보</b> — 검증 기간에서도 플러스이나 통계적 확신은 부족 ('+weak.length+'개)<br>';
    weak.slice(0,4).forEach(function(r){
      var o=r.oos?sg(r.oos.net)+'%':'—';
      html+='· '+r.tf_ko+' '+r.ko+' — 전체 '+sg(r.net)+'%, 검증30% '+o+', 표본 '+r.n+'<br>';
    });
  }
  if(over.length){
    html+='<br><b>과최적화 의심</b> — 학습에서만 통하고 검증에서 무너진 규칙 '+over.length+'개<br>';
  }
  html+='<br><span class="k">결론</span> — 단일 지표 규칙으로는 확실한 우위가 확인되지 않습니다. '+
    '15분봉은 모든 규칙이 비용 차감 후 마이너스이며, 이것이 단타가 어려운 구조적 이유입니다. '+
    '<b>전진검증 탭</b>에 오늘 이후 발생하는 신호가 자동 기록되므로, 시간이 지날수록 '+
    '조작 불가능한 근거가 쌓입니다.';
  n.innerHTML=html;

  var tabs=document.getElementById('tabs');
  tabs.innerHTML=Object.keys(D.meta).map(function(tf,i){
    return '<button data-tf="'+tf+'" onclick="show(\''+tf+'\')"'+(i===0?' class="on"':'')+'>'+
      D.meta[tf].ko+'</button>';
  }).join('')+'<button data-tf="_fwd" onclick="showFwd()" style="margin-left:8px">전진검증 (실시간 기록)</button>';
  show(Object.keys(D.meta)[0]);
  fetch('forward.json',{cache:'no-store'}).then(function(r){return r.json()})
    .then(function(j){FWD=j}).catch(function(){});
}

function showFwd(){
  var bs=document.querySelectorAll('.tabs button');
  for(var i=0;i<bs.length;i++) bs[i].className=(bs[i].getAttribute('data-tf')==='_fwd')?'on':'';
  var el=document.getElementById('panes');
  if(!FWD){ el.innerHTML='<div class="wrap">기록이 아직 없습니다. signal_log.py 가 1회 이상 실행되어야 합니다.</div>'; return; }
  var html='<div class="note" style="margin-bottom:12px"><b>전진 검증이란</b> — 백테스트는 과거 데이터에 맞춰 규칙을 고른 결과라 낙관적일 수밖에 없습니다. '+
   '여기 기록되는 신호는 <b>발생 시점에 저장</b>되고 이후 결과로 채점되므로 사후 조정이 불가능합니다. '+
   '표본이 쌓일수록 백테스트 수치와 비교해 과최적화 여부를 판단할 수 있습니다.</div>';
  Object.keys(FWD.summary).forEach(function(tf){
    var s2=FWD.summary[tf];
    html+='<div class="wrap"><h2>'+s2.ko+'</h2><div class="sub">기록 시작 '+(s2.since||'—')+
      ' · 총 '+s2.total+'건 (확정 '+s2.done+' / 진행중 '+s2.open+')</div>';
    if(s2.rules.length){
      html+='<table><thead><tr><th>규칙</th><th>표본</th><th>승률</th><th>순기대</th><th>t</th>'+
        '<th>PF</th><th>평균MAE</th><th>백테스트 대비</th></tr></thead><tbody>';
      s2.rules.forEach(function(r){
        var bt=null;
        if(D&&D.results[tf]) bt=D.results[tf].filter(function(x){return x.key===r.key})[0];
        var diff = bt? (r.net - bt.net) : null;
        html+='<tr><td>'+r.ko+'</td><td>'+r.n+'</td><td>'+f(r.winrate,1)+'%</td>'+
          '<td class="'+cls(r.net)+'"><b>'+sg(r.net)+'%</b></td>'+
          '<td>'+f(r.tstat_net)+'</td><td>'+(r.pf?f(r.pf):'—')+'</td>'+
          '<td class="d">'+f(r.avg_mae)+'%</td>'+
          '<td class="'+cls(diff)+'">'+(diff!=null?sg(diff)+'%p':'—')+'</td></tr>';
      });
      html+='</tbody></table>';
    } else html+='<div class="sub">확정된 표본이 부족합니다.</div>';
    if(s2.recent&&s2.recent.length){
      html+='<div class="sub" style="margin-top:10px">최근 신호</div><table style="min-width:600px"><tbody>';
      s2.recent.forEach(function(r){
        var st = r.done? (r.ret>0?'<span class="u">+'+f(r.ret)+'%</span>':'<span class="d">'+f(r.ret)+'%</span>')
                       : '<span class="n">진행중 '+(r.unrealized!=null?sg(r.unrealized)+'%':'')+'</span>';
        html+='<tr><td>'+r.at+'</td><td style="text-align:left">'+(r.key||'')+'</td>'+
          '<td>'+(r.side>0?'<span class="side l">롱</span>':'<span class="side s">숏</span>')+'</td>'+
          '<td>'+(r.entry?r.entry.toLocaleString():'')+'</td><td>'+st+'</td></tr>';
      });
      html+='</tbody></table>';
    }
    html+='</div>';
  });
  el.innerHTML=html;
}

function show(tf){
  CUR=tf;
  var bs=document.querySelectorAll('.tabs button');
  for(var i=0;i<bs.length;i++) bs[i].className=(bs[i].getAttribute('data-tf')===tf)?'on':'';
  var m=D.meta[tf], rows=D.results[tf];
  var SIDE={1:['롱','l'],'-1':['숏','s'],0:['양방','b']};
  var body=rows.map(function(r){
    var s=SIDE[r.side]||SIDE[0];
    return '<tr class="'+(r.verdict==='강'?'strong':'')+'">'+
      '<td><span class="side '+s[1]+'">'+s[0]+'</span>'+r.ko+'</td>'+
      '<td>'+r.n+'</td>'+
      '<td>'+f(r.winrate,1)+'%</td>'+
      '<td class="'+cls(r.net)+'"><b>'+sg(r.net)+'%</b></td>'+
      '<td class="'+(Math.abs(r.tstat_net)>=r.bonf_t?cls(r.tstat_net):'n')+'">'+f(r.tstat_net)+'</td>'+
      '<td class="'+(r.is?cls(r.is.net):'n')+'">'+(r.is?sg(r.is.net)+'% <span class="split">('+r.is.n+')</span>':'—')+'</td>'+
      '<td class="'+(r.oos?cls(r.oos.net):'n')+'">'+(r.oos?sg(r.oos.net)+'% <span class="split">('+r.oos.n+')</span>':'—')+'</td>'+
      '<td class="'+(r.regimes.bull?cls(r.regimes.bull.net):'n')+'">'+(r.regimes.bull?sg(r.regimes.bull.net)+'% <span class="split">('+r.regimes.bull.n+')</span>':'—')+'</td>'+
      '<td class="'+(r.regimes.bear?cls(r.regimes.bear.net):'n')+'">'+(r.regimes.bear?sg(r.regimes.bear.net)+'% <span class="split">('+r.regimes.bear.n+')</span>':'—')+'</td>'+
      '<td>'+(r.pf?f(r.pf):'—')+'</td>'+
      '<td class="d">'+f(r.avg_mae)+'%</td>'+
      '<td class="d">'+f(r.mdd,1)+'%</td>'+
      '<td><span class="vb '+r.verdict+'">'+r.verdict+'</span></td>'+
      '</tr>';
  }).join('');
  document.getElementById('panes').innerHTML=
    '<div class="wrap"><h2>'+m.ko+'</h2>'+
    '<div class="sub">'+m.from+' ~ '+m.to+' · '+m.bars.toLocaleString()+'봉 · 최대 보유 '+m.hold+'봉'+
    ' · 학습/검증 분할일 '+m.split_date+' · 보정 t 기준 '+f(m.bonf_t)+'</div>'+
    (m.control?'<div class="ctrl"><b>무작위 대조군</b> — 같은 손절·익절로 아무 시점에나 '+
      m.control.n+'회 진입 시 순기대값 <span class="'+cls(m.control.net)+'">'+sg(m.control.net,3)+
      '%</span>, 승률 '+f(m.control.winrate,1)+'%. 규칙은 이 값을 넘어야 의미가 있습니다.</div>':'')+
    '<table><thead><tr>'+
    '<th>규칙</th><th>표본</th><th>승률</th><th>순기대</th><th>t</th>'+
    '<th>학습70%</th><th>검증30%</th><th>상승장</th><th>하락장</th>'+
    '<th>PF</th><th>평균MAE</th><th>누적MDD</th><th>판정</th>'+
    '</tr></thead><tbody>'+body+'</tbody></table></div>';
}
</script>
</body>
</html>

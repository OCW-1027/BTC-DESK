<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BTC MTF — 멀티 타임프레임 지표</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--surface:#161b22;--surface2:#1c2128;--line:#30363d;
  --text:#c9d1d9;--muted:#8b949e;--faint:#6e7681;
  --up:#3fb950;--down:#f85149;--amber:#ffb224;--blue:#58a6ff;--teal:#2dd4bf;
}
body{background:var(--bg);color:var(--text);padding:14px;max-width:1300px;margin:0 auto;
  font:13px/1.5 -apple-system,"Hiragino Kaku Gothic ProN","Noto Sans KR",sans-serif}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
h1{font-size:16px;font-weight:700}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.dot.on{background:var(--up);animation:pulse 2s infinite}
.dot.err{background:var(--down)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.meta{color:var(--faint);font-size:11px;margin-left:auto}
button{background:var(--surface2);border:1px solid var(--line);color:var(--muted);
  padding:5px 11px;border-radius:6px;cursor:pointer;font-size:11.5px}
button:hover{border-color:var(--amber);color:var(--amber)}
.lang{display:inline-flex;gap:4px}
.lang button.on{background:var(--amber);color:#2a1f05;border-color:var(--amber)}

.hero{background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:14px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:12px}
.px{font-size:32px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.chg{font-variant-numeric:tabular-nums;font-size:14px}
.cons{margin-left:auto;text-align:right}
.cons .lbl{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.5px}
.cons .val{font-size:19px;font-weight:800;padding:3px 13px;border-radius:7px;display:inline-block;margin-top:3px}
.val.bull{background:rgba(63,185,80,.16);color:var(--up)}
.val.bear{background:rgba(248,81,73,.16);color:var(--down)}
.val.neutral{background:var(--surface2);color:var(--muted)}

.wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);
  border-radius:10px;padding:12px;margin-bottom:12px}
h2{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;
  margin-bottom:9px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:860px}
th{text-align:right;color:var(--faint);font-weight:600;font-size:10.5px;
  padding:5px 7px;border-bottom:1px solid var(--line);text-transform:uppercase}
th:first-child{text-align:left}
td{padding:6px 7px;border-bottom:1px solid #21262d;text-align:right;
  font-variant-numeric:tabular-nums}
td:first-child{text-align:left;font-weight:700;color:var(--text)}
tr:last-child td{border-bottom:0}
.u{color:var(--up)} .d{color:var(--down)} .n{color:var(--muted)}
.pill{padding:1px 7px;border-radius:999px;font-size:10.5px;font-weight:700}
.pill.above{background:rgba(63,185,80,.16);color:var(--up)}
.pill.below{background:rgba(248,81,73,.16);color:var(--down)}
.pill.inside{background:rgba(255,178,36,.16);color:var(--amber)}
.sc{font-weight:800;font-size:13px}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.kv{display:flex;justify-content:space-between;padding:3.5px 0;
  border-bottom:1px solid #21262d;font-size:12px}
.kv:last-child{border-bottom:0}
.kv span:last-child{font-variant-numeric:tabular-nums}
.spark{width:78px;padding-right:2px}
.spark svg{width:70px;height:22px;display:block}
.chartbox{margin:2px 0 9px;border:1px solid #21262d;border-radius:6px;
  background:var(--surface2);overflow:hidden}
.chartbox svg{width:100%;height:72px;display:block}
.cv{overflow:visible}
.bar{height:5px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--blue)}

.calcwrap{margin-top:12px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin-bottom:12px}
.cgrid label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted)}
.cgrid input,.cgrid select{background:var(--surface2);border:1px solid var(--line);color:var(--text);
  padding:6px 8px;border-radius:6px;font-size:13px;font-variant-numeric:tabular-nums;width:100%}
.cgrid input:focus,.cgrid select:focus{outline:none;border-color:var(--blue)}
.inrow{display:flex;gap:4px}
button.mini{padding:4px 8px;font-size:10px;white-space:nowrap}
.hint{display:inline-block;width:13px;height:13px;line-height:13px;text-align:center;
  border-radius:50%;background:var(--surface2);border:1px solid var(--line);color:var(--faint);
  font-size:9px;font-style:normal;cursor:help;margin-left:3px;position:relative}
.hint:hover{border-color:var(--amber);color:var(--amber)}
.tipbox{position:fixed;z-index:99;max-width:280px;background:#0b0f14;border:1px solid var(--amber);
  border-radius:7px;padding:8px 10px;font-size:11.5px;line-height:1.55;color:var(--text);
  box-shadow:0 6px 20px rgba(0,0,0,.6);pointer-events:none}
.tipbox b{color:var(--amber)}
.outgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.obox{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px}
.obox h3{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.5px;
  margin-bottom:7px;font-weight:600}
.orow{display:flex;justify-content:space-between;gap:8px;padding:3px 0;
  border-bottom:1px solid #21262d;font-size:12px}
.orow:last-child{border-bottom:0}
.orow b{font-variant-numeric:tabular-nums;font-weight:600}
.warn{background:rgba(248,81,73,.13);border-color:rgba(248,81,73,.45)}
.good{background:rgba(63,185,80,.10);border-color:rgba(63,185,80,.35)}
.chk{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid #21262d;font-size:12px;align-items:flex-start}
.chk:last-child{border-bottom:0}
.chk .mk{flex:0 0 16px;font-weight:800}
.chk .ds{color:var(--faint);font-size:10.5px}
footer{color:var(--faint);font-size:10.5px;margin-top:14px;text-align:center;line-height:1.7}
@media(max-width:560px){.px{font-size:25px}.cons{margin-left:0}}
</style>
</head>
<body>

<header>
  <h1>₿ BTC 멀티 타임프레임</h1>
  <span class="dot" id="dot"></span>
  <button onclick="refresh()" id="btnRefresh">새로고침</button>
  <a class="nav" href="backtest.html" style="background:var(--surface2);border:1px solid var(--line);color:var(--muted);padding:5px 11px;border-radius:6px;font-size:11.5px;text-decoration:none">백테스트 ↗</a>
  <span class="lang"><button id="bko" class="on" onclick="setLang('ko')">한국어</button><button id="bjp" onclick="setLang('jp')">日本語</button></span>
  <span class="meta" id="meta">불러오는 중…</span>
</header>

<div class="hero">
  <div>
    <div class="px" id="px">—</div>
    <div class="chg" id="chg">—</div>
  </div>
  <div class="cons">
    <div class="lbl"><span id="consLbl">타임프레임 종합</span><i class="hint" data-h="cons">?</i></div>
    <div class="val neutral" id="cons">—</div>
  </div>
</div>

<div class="wrap">
  <h2><span id="h2matrix">타임프레임 정렬 매트릭스</span><i class="hint" data-h="ichi">?</i></h2>
  <table>
    <thead><tr>
      <th id="thTF">TF</th><th id="thClose">종가</th><th><span id="thScore">점수</span><i class="hint" data-h="score">?</i></th>
      <th><span id="thIchi">일목</span><i class="hint" data-h="ichi">?</i></th><th><span id="thTK">전환/기준</span><i class="hint" data-h="tk">?</i></th><th><span id="thRib">리본</span><i class="hint" data-h="rib">?</i></th>
      <th><span id="thRsi">RSI</span><i class="hint" data-h="rsi">?</i></th><th><span id="thMacd">MACD-H</span><i class="hint" data-h="macd">?</i></th><th><span id="thB">%B</span><i class="hint" data-h="pb">?</i></th>
      <th><span id="thBw">밴드폭</span><i class="hint" data-h="bw">?</i></th><th><span id="thAtr">ATR%</span><i class="hint" data-h="atr">?</i></th><th id="thChart">추이</th>
    </tr></thead>
    <tbody id="matrix"></tbody>
  </table>
</div>

<div class="grid" id="cards"></div>


<!-- ══════════ 포지션 계산기 ══════════ -->
<div class="wrap calcwrap">
  <h2 id="h2calc">포지션 계산기</h2>

  <div class="cgrid">
    <label><span id="lbMargin">증거금</span><i class="hint" data-h="margin">?</i>
      <input id="iMargin" type="number" value="720" step="10"></label>
    <label><span id="lbLev">레버리지</span><i class="hint" data-h="lev">?</i>
      <input id="iLev" type="number" value="10" step="1" min="1" max="125"></label>
    <label><span id="lbSide">방향</span><i class="hint" data-h="side">?</i>
      <select id="iSide"><option value="long">롱 / ロング</option><option value="short">숏 / ショート</option></select></label>
    <label><span id="lbEntry">진입가</span><i class="hint" data-h="entry">?</i>
      <span class="inrow"><input id="iEntry" type="number" step="1">
      <button class="mini" onclick="useMarket()" id="btnMkt">현재가</button></span></label>
    <label><span id="lbSL">손절가</span><i class="hint" data-h="sl">?</i>
      <span class="inrow"><input id="iSL" type="number" step="1">
      <button class="mini" onclick="useATR()" id="btnAtr">ATR</button></span></label>
    <label><span id="lbMMR">유지증거금률 %</span><i class="hint" data-h="mmr">?</i>
      <input id="iMMR" type="number" value="0.4" step="0.05"></label>
    <label><span id="lbTFsrc">기준 TF</span><i class="hint" data-h="tfsrc">?</i>
      <select id="iTF"><option value="15m">15분</option><option value="1H">1시간</option>
      <option value="4H" selected>4시간</option><option value="1D">일봉</option></select></label>
  </div>

  <div id="calcOut"></div>
  <div id="revOut"></div>
  <div id="chkOut"></div>
</div>

<footer>
  <span id="foot1">데이터 OKX · 브라우저에서 직접 계산되므로 항상 최신입니다</span><br>
  <span id="foot2">정보 제공 목적이며 투자 자문이 아닙니다. 파생상품은 원금 전액 손실이 가능합니다.</span>
</footer>

<script src="indicators.js"></script>
<script>
var I = window.BTCIndicators;
var LAST = null;

function n(v, d) {
  if (v == null || !isFinite(v)) return '—';
  return v.toLocaleString('en-US', { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 });
}
function sg(v, d, suf) {
  if (v == null || !isFinite(v)) return '—';
  return (v > 0 ? '+' : '') + v.toFixed(d == null ? 2 : d) + (suf || '');
}
function cl(v) { return v == null ? 'n' : (v > 0 ? 'u' : (v < 0 ? 'd' : 'n')); }
function stat(c) { document.getElementById('dot').className = 'dot ' + c; }

var LANG = 'ko';
try { LANG = localStorage.getItem('btcmtf_lang') || 'ko'; } catch (e) {}

var ICHI = {
  ko: { above: '구름 위', below: '구름 아래', inside: '구름 안' },
  jp: { above: '雲の上',  below: '雲の下',    inside: '雲の中' }
};
var RIB = {
  ko: { bull: '정배열', bear: '역배열', mixed: '혼조' },
  jp: { bull: '正配列', bear: '逆配列', mixed: '混在' }
};
var T = {
  ko: { title: '₿ BTC 멀티 타임프레임', refresh: '새로고침', loading: '불러오는 중…',
        calc: '계산 중…', fail: '실패: ', cons: '타임프레임 종합',
        thTF:'TF', thClose:'종가', thScore:'점수', thIchi:'일목', thTK:'전환/기준',
        thRib:'리본', thRsi:'RSI', thMacd:'MACD-H', thB:'%B', thBw:'밴드폭', thAtr:'ATR%', thChart:'추이',
        matrix:'타임프레임 정렬 매트릭스',
        cloud:'일목 구름', bull:'양운', bear:'음운',
        bb:'볼린저 상/중/하', macdSig:'MACD / 시그널',
        slL:'손절 · 롱 (ATR×1.5)', slS:'손절 · 숏 (ATR×1.5)', tpL:'롱 목표 1R/1.75R/2.5R', tpS:'숏 목표 1R/1.75R/2.5R', rnote:'R = 손절까지 거리',
        dayRsi:'일봉 RSI', pctb:'볼린저 %B', basis:' JST 기준',
        foot1:'데이터 OKX · 브라우저에서 직접 계산되므로 항상 최신입니다',
        foot2:'정보 제공 목적이며 투자 자문이 아닙니다. 파생상품은 원금 전액 손실이 가능합니다.' },
  jp: { title: '₿ BTC マルチタイムフレーム', refresh: '更新', loading: '読み込み中…',
        calc: '計算中…', fail: '失敗: ', cons: 'タイムフレーム総合',
        thTF:'TF', thClose:'終値', thScore:'スコア', thIchi:'一目', thTK:'転換/基準',
        thRib:'リボン', thRsi:'RSI', thMacd:'MACD-H', thB:'%B', thBw:'バンド幅', thAtr:'ATR%', thChart:'推移',
        matrix:'タイムフレーム整列マトリクス',
        cloud:'一目 雲', bull:'陽転', bear:'陰転',
        bb:'ボリンジャー 上/中/下', macdSig:'MACD / シグナル',
        slL:'損切り・ロング (ATR×1.5)', slS:'損切り・ショート (ATR×1.5)', tpL:'ロング目標 1R/1.75R/2.5R', tpS:'ショート目標 1R/1.75R/2.5R', rnote:'R = 損切りまでの距離',
        dayRsi:'日足 RSI', pctb:'ボリンジャー %B', basis:' JST 基準',
        foot1:'データ OKX · ブラウザで直接計算するため常に最新です',
        foot2:'情報提供目的であり投資助言ではありません。デリバティブは元本全損の可能性があります。' }
};
function t(k) { return T[LANG][k]; }

var CLBL={ko:{h2calc:'포지션 계산기',lbMargin:'증거금',lbLev:'레버리지',lbSide:'방향',
 lbEntry:'진입가',lbSL:'손절가',lbMMR:'유지증거금률 %',lbTFsrc:'기준 TF',btnMkt:'현재가',btnAtr:'ATR'},
 jp:{h2calc:'ポジション計算機',lbMargin:'証拠金',lbLev:'レバレッジ',lbSide:'方向',
 lbEntry:'エントリー価格',lbSL:'損切り価格',lbMMR:'維持証拠金率 %',lbTFsrc:'基準TF',btnMkt:'現在値',btnAtr:'ATR'}};

function setLang(L) {
  LANG = L;
  try { localStorage.setItem('btcmtf_lang', L); } catch (e) {}
  document.documentElement.lang = (L === 'ko' ? 'ko' : 'ja');
  document.getElementById('bko').className = (L === 'ko' ? 'on' : '');
  document.getElementById('bjp').className = (L === 'jp' ? 'on' : '');
  document.querySelector('h1').textContent = t('title');
  document.getElementById('btnRefresh').textContent = t('refresh');
  document.getElementById('consLbl').textContent = t('cons');
  document.getElementById('h2matrix').textContent = t('matrix');
  document.getElementById('foot1').textContent = t('foot1');
  document.getElementById('foot2').textContent = t('foot2');
  ['thTF','thClose','thScore','thIchi','thTK','thRib','thRsi','thMacd','thB','thBw','thAtr','thChart']
    .forEach(function (k) { var e = document.getElementById(k); if (e) e.textContent = t(k); });
  var cl=CLBL[L]||CLBL.ko;
  Object.keys(cl).forEach(function(k){var e=document.getElementById(k); if(e) e.textContent=cl[k];});
  if (LAST) render(LAST);
}

// ── SVG 차트 ─────────────────────────────────────────────
// 의존성 없음. 종가 라인 + 볼린저 밴드 음영 + 일목 구름 음영.
function scaleY(v, lo, hi, H, pad) {
  pad = pad || 0;
  if (hi === lo) return H / 2;
  return pad + (H - 2 * pad) * (1 - (v - lo) / (hi - lo));
}

function chartSVG(ser, W, H, opts) {
  opts = opts || {};
  if (!ser || ser.length < 2) return '';
  var mini = !!opts.mini;
  var n = ser.length, i, p;

  // Y 범위: 종가와 밴드/구름을 모두 포함
  var lo = Infinity, hi = -Infinity;
  for (i = 0; i < n; i++) {
    p = ser[i];
    [p.c, p.bu, p.bl].forEach(function (v) {
      if (v != null) { if (v < lo) lo = v; if (v > hi) hi = v; }
    });
    if (!mini && p.cl != null) {
      if (p.cl < lo) lo = p.cl;
      if (p.ch > hi) hi = p.ch;
    }
  }
  if (!isFinite(lo) || !isFinite(hi)) return '';
  var m = (hi - lo) * 0.06 || 1;
  lo -= m; hi += m;

  var X = function (i) { return (W * i) / (n - 1); };
  var Y = function (v) { return scaleY(v, lo, hi, H, 1); };

  function area(keyHi, keyLo) {
    var up = [], dn = [], any = false;
    for (i = 0; i < n; i++) {
      p = ser[i];
      if (p[keyHi] == null || p[keyLo] == null) continue;
      any = true;
      up.push(X(i).toFixed(1) + ',' + Y(p[keyHi]).toFixed(1));
      dn.unshift(X(i).toFixed(1) + ',' + Y(p[keyLo]).toFixed(1));
    }
    return any ? 'M' + up.join('L') + 'L' + dn.join('L') + 'Z' : '';
  }

  function line(key) {
    var d = '', started = false;
    for (i = 0; i < n; i++) {
      p = ser[i];
      if (p[key] == null) continue;
      d += (started ? 'L' : 'M') + X(i).toFixed(1) + ',' + Y(p[key]).toFixed(1);
      started = true;
    }
    return d;
  }

  var last = ser[n - 1], first = ser[0];
  var col = last.c >= first.c ? 'var(--up)' : 'var(--down)';
  var out = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" class="cv">';

  if (!mini) {
    var cloud = area('ch', 'cl');
    if (cloud) out += '<path d="' + cloud + '" fill="rgba(45,212,191,.13)"/>';
  }
  var bb = area('bu', 'bl');
  if (bb) out += '<path d="' + bb + '" fill="rgba(88,166,255,.10)"/>';
  if (!mini) {
    out += '<path d="' + line('bm') + '" stroke="rgba(139,148,158,.5)" stroke-width="1" fill="none" stroke-dasharray="3 3"/>';
  }
  out += '<path d="' + line('c') + '" stroke="' + col + '" stroke-width="' + (mini ? 1.2 : 1.6) + '" fill="none"/>';
  out += '<circle cx="' + X(n - 1).toFixed(1) + '" cy="' + Y(last.c).toFixed(1) + '" r="' + (mini ? 1.6 : 2.4) + '" fill="' + col + '"/>';
  out += '</svg>';
  return out;
}

function render(results) {
  LAST = results;
  var ok = results.filter(function (r) { return r.ok; });
  if (!ok.length) { stat('err'); return; }

  var day = results.filter(function (r) { return r.key === '1D'; })[0];
  var px = ok[ok.length - 1].data.close;
  document.getElementById('px').textContent = '$' + n(px);

  if (day && day.ok) {
    var c = day.data, prev = null;
    // 일봉 기준 등락은 SMA 대신 직전 종가가 필요하므로 생략하고 %B 로 대체 표기
    document.getElementById('chg').innerHTML =
      t('dayRsi') + ' <b>' + c.rsi.toFixed(1) + '</b> · ' +
      t('pctb') + ' <b>' + (c.boll ? c.boll.pctB.toFixed(2) : '—') + '</b>';
  }

  var cons = I.consensus(results);
  var ce = document.getElementById('cons');
  ce.textContent = (cons.pct > 0 ? '+' : '') + cons.pct.toFixed(0) + '%';
  ce.className = 'val ' + cons.stance;

  // ── 매트릭스
  var rows = '';

      rows += '<tr><td>' + (LANG === 'ko' ? r.ko : r.jp) + '</td><td colspan="11" class="n">' + r.error + '</td></tr>';

    }

    rows += '<tr>' +
      '<td>' + (LANG === 'ko' ? r.ko : r.jp) + '</td>' +
      '<td>' + n(a.close) + '</td>' +
      '<td class="sc ' + cl(s.score) + '">' + (s.score > 0 ? '+' : '') + s.score + '</td>' +

      '</tr>';
  });
  document.getElementById('matrix').innerHTML = rows;

  // ── 타임프레임별 상세 카드

             ' <span class="' + cl(d) + '">' + sg(d, 2, '%') + '</span></span></div>';
    }).join('');

    cards += '<div class="card"><h2>' + (LANG === 'ko' ? r.ko : r.jp) + '</h2>' +
      '<div class="chartbox">' + chartSVG(a.series, 260, 72) + '</div>' +
      ribRows +
      (ic ? '<div class="kv"><span>' + t('cloud') + '</span><span>' + n(ic.cloudLow) + '~' + n(ic.cloudHigh) +
            ' <span class="' + (ic.bullCloud ? 'u' : 'd') + '">' + (ic.bullCloud ? t('bull') : t('bear')) +
            '</span></span></div>' : '') +
      (b ? '<div class="kv"><span>' + t('bb') + '</span><span>' + n(b.upper) + ' / ' + n(b.mid) +
           ' / ' + n(b.lower) + '</span></div>' +
           '<div class="bar"><i style="width:' + Math.max(0, Math.min(100, b.pctB * 100)) + '%"></i></div>' : '') +
      (a.macd ? '<div class="kv"><span>' + t('macdSig') + '</span><span>' + sg(a.macd.macd, 0) + ' / ' +
                sg(a.macd.signal, 0) + '</span></div>' : '') +
      (rr ? '<div class="kv"><span>' + t('slL') + '</span><span class="d">' + n(rr.longSL) + '</span></div>' +
            '<div class="kv"><span>' + t('tpL') + '</span><span class="u">' +
            rr.tp.map(function (x) { return n(x.price); }).join(' / ') + '</span></div>' +
            '<div class="kv"><span>' + t('slS') + '</span><span class="d">' + n(rr.shortSL) + '</span></div>' +
            '<div class="kv"><span>' + t('tpS') + '</span><span class="u">' +
            rr.tpShort.map(function (x) { return n(x.price); }).join(' / ') + '</span></div>' : '') +
      '</div>';
  });
  document.getElementById('cards').innerHTML = cards;

  document.getElementById('meta').textContent =
    new Date().toLocaleString('ko-KR', { timeZone: 'Asia/Tokyo' }) + t('basis');
  stat('on');
  try { calc(); bindHints(); } catch (e) { console.log('calc', e); }
}

var _tip=null;
function showTip(el){
  hideTip();
  var k=el.getAttribute('data-h');
  var txt=(HINTS[LANG]||HINTS.ko)[k];
  if(!txt) return;
  _tip=document.createElement('div');
  _tip.className='tipbox';
  _tip.innerHTML=txt;
  document.body.appendChild(_tip);
  var r=el.getBoundingClientRect();
  var w=_tip.offsetWidth,h=_tip.offsetHeight;
  var x=Math.min(window.innerWidth-w-8,Math.max(8,r.left-w/2+r.width/2));
  var y=r.top-h-8; if(y<8) y=r.bottom+8;
  _tip.style.left=x+'px'; _tip.style.top=y+'px';
}
function hideTip(){ if(_tip){_tip.remove();_tip=null;} }
function bindHints(){
  var hs=document.querySelectorAll('.hint');
  for(var i=0;i<hs.length;i++){
    var e=hs[i];
    e.onmouseenter=function(){showTip(this)};
    e.onmouseleave=hideTip;
    e.onclick=function(ev){ev.stopPropagation(); if(_tip)hideTip(); else showTip(this);};
  }
}
document.addEventListener('click',hideTip);
window.addEventListener('scroll',hideTip,true);

// ══════════ 포지션 계산 ══════════
function tfData(key){
  if(!LAST) return null;
  var r=LAST.filter(function(x){return x.key===key&&x.ok})[0];
  return r?r.data:null;
}
function curPx(){
  var d=tfData('1m')||tfData('1H');
  return d?d.close:null;
}
function useMarket(){
  var p=curPx(); if(p) document.getElementById('iEntry').value=Math.round(p);
  calc();
}
function useATR(){
  var tf=document.getElementById('iTF').value, d=tfData(tf);
  var e=parseFloat(document.getElementById('iEntry').value)||curPx();
  if(!d||!e) return;
  var side=document.getElementById('iSide').value;
  var sl=side==='long'? e-d.atr*1.5 : e+d.atr*1.5;
  document.getElementById('iSL').value=Math.round(sl);
  calc();
}

function num(id){ return parseFloat(document.getElementById(id).value); }

function calc(){
  var out=document.getElementById('calcOut');
  var rev=document.getElementById('revOut');
  var chk=document.getElementById('chkOut');
  if(!out) return;

  var M=num('iMargin'), L=num('iLev'), side=document.getElementById('iSide').value;
  var E=num('iEntry'), SL=num('iSL'), MMR=num('iMMR')/100;
  var tf=document.getElementById('iTF').value, d=tfData(tf);
  var px=curPx();
  if(!E&&px){ E=Math.round(px); document.getElementById('iEntry').value=E; }
  if(!M||!L||!E){ out.innerHTML='<div class="obox">입력값을 확인하세요</div>'; return; }

  var isL=side==='long';
  var notional=M*L, qty=notional/E;
  // 청산가: 증거금이 유지증거금 수준까지 소진되는 가격
  var buf=(M-notional*MMR)/qty;
  var liq=isL? E-buf : E+buf;
  var liqD=(liq/E-1)*100;

  var rows='';
  function R(k,v,c){ rows+='<div class="orow"><span>'+k+'</span><b class="'+(c||'')+'">'+v+'</b></div>'; }
  var f0=function(v){return v==null||!isFinite(v)?'—':Math.round(v).toLocaleString('en-US')};
  var f2=function(v){return v==null||!isFinite(v)?'—':v.toFixed(2)};

  R(LANG==='ko'?'명목금액':'想定元本', f0(notional)+' USDT');
  R(LANG==='ko'?'수량':'数量', qty.toFixed(5)+' BTC');
  R(LANG==='ko'?'청산가':'清算価格', f0(liq), 'd');
  R(LANG==='ko'?'청산까지':'清算まで', f2(Math.abs(liqD))+'%', Math.abs(liqD)<5?'d':'');

  // 손절
  var slLoss=null, slPct=null, slDist=null, atrMult=null;
  if(SL&&isFinite(SL)){
    slDist=Math.abs(E-SL);
    slLoss=slDist*qty;
    slPct=slLoss/M*100;
    R(LANG==='ko'?'손절 거리':'損切り距離', f2(slDist/E*100)+'%');
    R(LANG==='ko'?'손절 손실':'損切り損失', '-'+f0(slLoss)+' USDT', 'd');
    R(LANG==='ko'?'증거금 대비':'証拠金比', '-'+f2(slPct)+'%', slPct>30?'d':'');
    if(d){ atrMult=slDist/d.atr; R(LANG==='ko'?'ATR 대비':'ATR比', f2(atrMult)+(LANG==='ko'?'배':'倍'), atrMult<1?'d':'u'); }
    var slBeyond = isL? (SL<=liq) : (SL>=liq);
    if(slBeyond) R('⚠', LANG==='ko'?'손절이 청산가 밖':'損切りが清算価格の外','d');
  }
  // 펀딩
  var fRate=0.01;
  R(LANG==='ko'?'펀딩(0.01% 가정)':'資金調達(0.01%想定)','-'+f2(notional*0.0001*3)+' USDT/'+(LANG==='ko'?'일':'日'));

  var box1='<div class="obox'+(Math.abs(liqD)<5?' warn':'')+'"><h3>'+(LANG==='ko'?'포지션':'ポジション')+'</h3>'+rows+'</div>';

  // R:R 목표가
  var rr='';
  if(slDist){
    [1,1.5,2,3].forEach(function(k){
      var tp=isL? E+slDist*k : E-slDist*k;
      var prof=slDist*k*qty;
      rr+='<div class="orow"><span>'+k+'R</span><b class="u">'+f0(tp)+'  (+'+f0(prof)+')</b></div>';
    });
  } else rr='<div class="orow"><span>'+(LANG==='ko'?'손절가를 입력하세요':'損切り価格を入力')+'</span><b>—</b></div>';
  var box2='<div class="obox"><h3>'+(LANG==='ko'?'목표가 — R 배수 (R = 손절까지 거리)':'目標値 — R倍 (R = 損切りまでの距離)')+'</h3>'+rr+'</div>';

  // 주요 레벨 도달 시 손익
  var lv='';
  if(d){
    var cands=[];
    if(d.ichimoku){ cands.push([LANG==='ko'?'일목 기준선':'一目 基準線',d.ichimoku.kijun]); cands.push([LANG==='ko'?'구름 상단':'雲 上限',d.ichimoku.cloudHigh]); cands.push([LANG==='ko'?'구름 하단':'雲 下限',d.ichimoku.cloudLow]); }
    if(d.boll){ cands.push(['BB '+(LANG==='ko'?'상단':'上限'),d.boll.upper]); cands.push(['BB '+(LANG==='ko'?'중심':'中心'),d.boll.mid]); cands.push(['BB '+(LANG==='ko'?'하단':'下限'),d.boll.lower]); }
    cands.push(['SMA200',d.ribbon[200]]);
    cands.sort(function(a,b){return b[1]-a[1]});
    cands.forEach(function(c){
      if(!c[1]) return;
      var pnl=(isL? c[1]-E : E-c[1])*qty;
      lv+='<div class="orow"><span>'+c[0]+' '+f0(c[1])+'</span><b class="'+(pnl>0?'u':'d')+'">'+(pnl>0?'+':'')+f0(pnl)+'</b></div>';
    });
  }
  var box3='<div class="obox"><h3>'+(LANG==='ko'?'레벨 도달 시 손익 (USDT)':'レベル到達時の損益')+'</h3>'+(lv||'—')+'</div>';

  out.innerHTML='<div class="outgrid">'+box1+box2+box3+'</div>';

  // ── 역산
  var rv='';
  function RV(k,v,c){ rv+='<div class="orow"><span>'+k+'</span><b class="'+(c||'')+'">'+v+'</b></div>'; }
  if(d){
    // 1) 주요 레벨까지 견디려면 최대 레버리지
    var targets=[];
    if(d.ichimoku){ targets.push([LANG==='ko'?'구름 반대편':'雲の反対側', isL?d.ichimoku.cloudLow:d.ichimoku.cloudHigh]); }
    if(d.boll){ targets.push([LANG==='ko'?'BB 중심선':'BB中心線', d.boll.mid]); }
    targets.push(['SMA200', d.ribbon[200]]);
    targets.forEach(function(t){
      if(!t[1]) return;
      var dist=Math.abs(E-t[1])/E;
      var maxL=1/(dist+MMR);
      if(maxL>0&&isFinite(maxL)) RV(t[0]+' '+f0(t[1]), '≤ '+f2(maxL)+'x', maxL<L?'d':'u');
    });
    // 2) 손실 제한 역산
    if(slDist){
      [10,20,30].forEach(function(pc){
        var maxQty=(M*pc/100)/slDist;
        var maxN=maxQty*E;
        RV((LANG==='ko'?'손실 ':'損失 ')+pc+'% 제한', f2(maxN/M)+'x  ('+maxQty.toFixed(5)+' BTC)');
      });
    }
    // 3) ATR 기준 권장
    var recSL=d.atr*1.5;
    var recL=1/((recSL/E)*3+MMR);
    RV(LANG==='ko'?'ATR×1.5 손절 · 증거금 33% 손실 기준':'ATR×1.5損切り・証拠金33%基準', '≤ '+f2(recL)+'x','u');
  }
  rev.innerHTML='<div class="outgrid" style="margin-top:10px"><div class="obox"><h3>'+
    (LANG==='ko'?'역산 — 최대 레버리지':'逆算 — 最大レバレッジ')+'</h3>'+(rv||'—')+'</div>'+
    buildChecklist(d,{M:M,L:L,E:E,SL:SL,liq:liq,liqD:liqD,slPct:slPct,atrMult:atrMult,isL:isL,notional:notional})+'</div>';
  chk.innerHTML='';
}

function buildChecklist(d,o){
  var items=[];
  function add(ok,ko,jp,dsKo,dsJp){ items.push({ok:ok,t:LANG==='ko'?ko:jp,ds:LANG==='ko'?dsKo:dsJp}); }

  // 1. 청산 여유
  add(Math.abs(o.liqD)>=8,'청산까지 8% 이상 여유','清算まで8%以上の余裕',
      '현재 '+Math.abs(o.liqD).toFixed(1)+'%','現在 '+Math.abs(o.liqD).toFixed(1)+'%');
  // 2. 손절 설정
  add(!!o.SL&&isFinite(o.SL),'손절가 설정됨','損切り設定済み','진입과 동시에 주문','エントリーと同時に発注');
  // 3. ATR 대비 손절
  if(o.atrMult!=null) add(o.atrMult>=1,'손절이 ATR 1배 이상','損切りがATR1倍以上',
      o.atrMult.toFixed(2)+'배','×'+o.atrMult.toFixed(2));
  // 4. 손실 한도
  if(o.slPct!=null) add(o.slPct<=30,'손실이 증거금 30% 이내','損失が証拠金30%以内',
      o.slPct.toFixed(1)+'%',o.slPct.toFixed(1)+'%');
  // 5. 손절이 청산 안쪽
  if(o.SL) add(o.isL? o.SL>o.liq : o.SL<o.liq,'손절이 청산가 안쪽','損切りが清算価格の内側',
      '청산 전에 끊긴다','清算前に切れる');
  // 6. 상위 TF 방향 일치
  if(LAST){
    var cons=window.BTCIndicators.consensus(LAST);
    var agree = o.isL? cons.pct>0 : cons.pct<0;
    add(agree,'상위 타임프레임 방향과 일치','上位TFの方向と一致',
        '종합 '+cons.pct.toFixed(0)+'%','総合 '+cons.pct.toFixed(0)+'%');
  }
  // 7. 과열 구간 진입 여부
  if(d&&d.rsi!=null){
    var overheated = o.isL? d.rsi>=70 : d.rsi<=30;
    add(!overheated,'과열 구간 진입 아님','過熱圏でのエントリーでない',
        'RSI '+d.rsi.toFixed(1),'RSI '+d.rsi.toFixed(1));
  }
  // 8. 밴드 위치
  if(d&&d.boll&&d.boll.pctB!=null){
    var b=d.boll.pctB;
    var bad = o.isL? b>0.85 : b<0.15;
    add(!bad,'밴드 극단부 아님','バンド極端部でない','%B '+b.toFixed(2),'%B '+b.toFixed(2));
  }

  var ok=items.filter(function(x){return x.ok}).length;
  var html='<div class="obox'+(ok===items.length?' good':(ok<items.length-2?' warn':''))+'"><h3>'+
    (LANG==='ko'?'진입 체크리스트':'エントリーチェックリスト')+'  '+ok+'/'+items.length+'</h3>';
  items.forEach(function(x){
    html+='<div class="chk"><span class="mk '+(x.ok?'u':'d')+'">'+(x.ok?'✓':'✕')+'</span>'+
          '<span>'+x.t+'<br><span class="ds">'+x.ds+'</span></span></div>';
  });
  html+='</div>';
  return html;
}

// 입력 변경 시 재계산
['iMargin','iLev','iSide','iEntry','iSL','iMMR','iTF'].forEach(function(id){
  var e=document.getElementById(id);
  if(e){ e.addEventListener('input',calc); e.addEventListener('change',calc); }
});

refresh();
setInterval(function () { if (!document.hidden) refresh(); }, 60000);
document.addEventListener('visibilitychange', function () { if (!document.hidden) refresh(); });
</script>
